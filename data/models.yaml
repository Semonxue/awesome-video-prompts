klingo1:
  name: Kling O1
  company: Kuaishou
  slug: klingo1
  url: https://klingai.com/
  description: >-
    Kuaishou's all-around video generation model. Accurately understands natural language intent, supports multimodal input, and generates high-quality videos with complex motion and physical laws. Approximate launch: June 2024.
kling26:
  name: Kling 2.6
  company: Kuaishou
  slug: kling26
  url: https://klingai.com/
  description: >-
    An upgraded version of Kuaishou Kling. Significantly optimized in motion amplitude, image clarity, and generation speed, especially suitable for generating intense action scenes. Approximate launch: January 2026.
kling3:
  name: Kling 3.0
  company: Kuaishou
  slug: kling3
  url: https://klingai.com/
  description: >-
    The new flagship model of Kuaishou Kling. Features cinema-grade image quality and stronger semantic understanding capabilities, supporting longer continuous video generation. Approximate launch: January 2026.
hailuo:
  name: Hailuo
  company: MiniMax
  slug: hailuo
  url: https://hailuoai.video/
  description: >-
    MiniMax's Hailuo AI video model (Hailuo 2.3). Its advantages lie in extremely fast generation speed and excellent semantic understanding, capable of generating smooth videos that conform to physical logic, supporting image-to-video. Approximate launch: September 2024.
veo3:
  name: Veo 3
  company: Google DeepMind
  slug: veo3
  url: https://deepmind.google/technologies/veo/
  description: >-
    Google DeepMind's Veo 3 video generation model (including 3.0 and 3.1). The biggest breakthrough is native "video + audio" generation, supporting more precise prompt control, character consistency maintenance, and cinema-grade 4K resolution output. Approximate launch: November 2025.
sora:
  name: Sora
  company: OpenAI
  slug: sora
  url: https://openai.com/sora
  description: >-
    OpenAI's disruptive text-to-video model. Capable of generating videos up to 60 seconds long containing highly detailed backgrounds, complex camera movements, and multiple characters, with strong physical world simulation capabilities. Announced February 2024.
sora2:
  name: Sora 2
  company: OpenAI
  slug: sora2
  url: https://openai.com/sora
  description: >-
    OpenAI's Sora 2 video generation model. Features significant improvements in video quality, physics simulation, and prompt adherence compared to the original Sora. Supports longer duration, higher resolution, and more complex scene generation. Approximate launch: 2025.
ltxpro:
  name: LTX Pro
  company: Lightricks
  slug: ltxpro
  url: https://www.lightricks.com/ltxv
  description: >-
    LTX Video Professional Edition launched by Lightricks. Focuses on real-time performance and high efficiency, specifically optimized for commercial video production workflows, supporting precise camera control. Approximate launch: Late 2025.
grok:
  name: Grok
  company: xAI
  slug: grok
  url: https://x.ai/
  description: >-
    Multimodal large model launched by xAI. Integrates strong language understanding and visual generation capabilities, generating high-quality short videos directly via prompts on the X platform, with unique stylized performance. Approximate launch: Late 2024.
ray314:
  name: Ray 3.14 (Luma)
  company: Luma AI
  slug: ray314
  url: https://luma.ai/dream-machine
  description: >-
    Luma AI's next-generation video model (Dream Machine). Known for extremely fast generation speed, supports Keyframes control and high dynamic action generation, suitable for rapid creative iteration. Approximate launch: February 2026.
lumalabs:
  name: Luma Labs
  company: Luma AI
  slug: lumalabs
  url: https://lumalabs.ai/dream-machine
  description: >-
    Luma AI Dream Machine. A high-quality video generator, excelling at handling complex object motion and deformation, generating dream-like smooth videos. Launched June 2024.
gen45:
  name: Gen 4.5
  company: Runway
  slug: gen45
  url: https://runwayml.com/
  description: >-
    Runway's new generation video generation model. Built on Gen-3 Alpha, providing finer Director Mode control, with a qualitative leap in lighting consistency and temporal coherence. Approximate launch: December 2025.
viduq3:
  name: Vidu Q3
  company: Shengshu Technology
  slug: viduq3
  url: https://www.vidu.studio/
  description: >-
    Upgraded Vidu model released by Shengshu Technology. Not only supports long video generation but also has unique advantages in multi-shot consistency and understanding of Chinese elements, supporting "one-click film creation". Approximate launch: January 2026.
seedance1.5pro:
  name: Seedance 1.5 Pro
  company: ByteDance Seed
  slug: seedance1.5pro
  url: https://seed.bytedance.com/en/seedance1_5_pro
  description: >-
    ByteDance Seed's joint audio-video model. Follows complex instructions, generates native audio with spatial sound and lip-sync alignment, and delivers film-grade cinematography with cohesive storytelling. Approximate launch: 2026.
seedance2:
  name: Seedance 2.0
  company: ByteDance Seed
  slug: seedance2
  url: https://seed.bytedance.com/
  description: >-
    ByteDance Seed's advanced text-to-video model. Supports complex scene generation with detailed prompts, high-quality visuals, and cinematic effects. Approximate launch: 2026.
dreamina:
  name: Dreamina AI
  company: Dreamina AI
  slug: dreamina
  url: https://dreamina.ai/
  description: >-
    Dreamina AI's video generation model, known for fast generation, creative and meme-style outputs, supporting FPV and dynamic scenes. Approximate launch: 2026.
hedra:
  name: Hedra Omnia
  company: Hedra Labs
  slug: hedra
  url: https://hedra.com/
  description: >-
    AI video generation model by Hedra Labs, supporting audio-driven timing, full-body motion, and camera control in a single model. Approximate launch: 2026.
wan26:
  name: Wan 2.6
  company: MangaNow
  slug: wan26
  url: https://manganow.ai/
  description: >-
    Wan 2.6 text-to-video model by MangaNow, supporting anime-style video generation with detailed prompts and cinematic effects. Approximate launch: 2026.
pixverse:
  name: PixVerse
  company: PixVerse
  slug: pixverse
  url: https://pixverse.ai/
  description: >-
    PixVerse AI video generation model, supporting cinematic shots, action sequences, and creative content generation. Approximate launch: 2024.
nanobanana2:
  name: Nano Banana 2
  company: Nano Banana
  slug: nanobanana2
  url: https://nanobanana.ai/
  description: >-
    Nano Banana 2 is an advanced AI image and video generation model known for its comedic, pet, and creative content outputs. Often used for humor, transformation, and whimsical visual storytelling.
