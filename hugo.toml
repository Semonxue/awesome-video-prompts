baseURL = 'https://awesomevideoprompts.com/'
relativeURLs = false
canonifyURLs = false
title = 'Awesome Video Prompts'
theme = 'ananke'

buildFuture = true
buildExpired = true
buildDrafts = false

enableRobotsTXT = true

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

# 项目版本
[params]
  version = '0.4.0'
  author = 'Semon'
  github_repo = "https://github.com/Semonxue/awesome-video-prompts"

# 多语言配置
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

[taxonomies]
  tag = "tags"
  category = "categories"
  model = "models"

[outputFormats.PromptsJSON]
  mediaType = "application/json"
  baseName = "prompts-index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "PromptsJSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[languages]
[languages.en]
  title = 'Seedance2, HappyHorse, Gemini Omni, Kling3 AI Video Prompts | Awesome Video Prompts'
    weight = 1
    languageName = 'English'
    contentDir = 'content/en'

[languages.zh-cn]
  title = 'Seedance2、HappyHorse、Gemini Omni、Kling3 AI视频提示词 | 精彩视频提示词'
    weight = 2
    languageName = '简体中文'
    contentDir = 'content/zh-cn'

[languages.ja]
  title = 'Seedance2、HappyHorse、Gemini Omni、Kling3 AI動画プロンプト | 素晴らしい動画プロンプト'
    weight = 3
    languageName = '日本語'
    contentDir = 'content/ja'

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
    lang = 'en'

  # For zh-cn, mount zh-cn specific pages
  [[module.mounts]]
    source = 'content/zh-cn'
    target = 'content'
    lang = 'zh-cn'
  # Mount shared prompts from root 'content/prompts'
  [[module.mounts]]
    source = 'content/prompts'
    target = 'content/prompts'
    lang = 'zh-cn'

  # For ja, mount ja specific pages
  [[module.mounts]]
    source = 'content/ja'
    target = 'content'
    lang = 'ja'
  [[module.mounts]]
    source = 'content/prompts'
    target = 'content/prompts'
    lang = 'ja'
