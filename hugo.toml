baseURL = 'https://semonxue.github.io/awesome-video-prompts/'
title = 'Awesome Video Prompts'
theme = 'ananke'

# 项目版本
[params]
  version = '0.1.1'
  author = 'Semon'
  description = 'A collection of awesome video prompts'

# 多语言配置
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    title = 'Awesome Video Prompts'
    weight = 1
    languageName = 'English'
    contentDir = 'content'
  [languages.zh-cn]
    title = '精彩视频提示词'
    weight = 2
    languageName = '简体中文'
    contentDir = 'content'

# 多语言配置
