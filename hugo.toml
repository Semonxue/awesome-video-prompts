baseURL = 'https://example.org/'
title = 'Awesome Video Prompts'
theme = 'ananke'

# 多语言配置
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    title = 'Awesome Video Prompts'
    weight = 1
    languageName = 'English'
    contentDir = 'content'
  [languages.zh-cn]
    title = '精彩视频提示词'
    weight = 2
    languageName = '简体中文'
    contentDir = 'content'

[params]
  author = 'Your Name'
  description = 'A collection of awesome video prompts'
