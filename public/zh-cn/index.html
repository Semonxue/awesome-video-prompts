    .search-row {

    .search-icon {

    .model-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .model-tag {
      display: flex;
      align-items: center;
      height: 36px;
      padding: 0 16px;

      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      font-size: 13px;

      cursor: pointer;
      transition: all 0.2s;

    .model-tag:hover {

    .model-tag.active {
      background: var(--accent-primary);
      color: var(--bg-surface);
      border-color: var(--accent-primary);
    }
    
    .model-tag.more {
      background: transparent;
      padding: 0 12px;
    }
    
     
    .content-tag-area {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .content-tag {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 14px;
      background: var(--bg-muted);
      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    .content-tag:hover {
      background: var(--border-subtle);
    }
    
    .content-tag.active {
      background: var(--accent-primary);
      color: var(--bg-surface);
      border-color: var(--accent-primary);
    }
    
    .content-tag.more {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-tertiary);
    }
    
     
    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .grid-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .result-count {
      font-size: 14px;
      color: var(--text-tertiary);
    }
    
     
    .masonry-grid {
      column-count: 5;
      column-gap: 16px;
    }
    
    @media (max-width: 1440px) {

        column-count: 4;
      }

    @media (max-width: 1200px) {
      .masonry-grid {
        column-count: 3;

    }
    
    @media (max-width: 900px) {
      .masonry-grid {
        column-count: 2;
      }
    }
    
    @media (max-width: 640px) {
      .masonry-grid {
        column-count: 1;
      }
      .header-container,
      .main-content {
        padding-left: 16px;
        padding-right: 16px;
      }
      .header-full {
        margin-left: -16px;
        margin-right: -16px;
        padding-left: 16px;
        padding-right: 16px;
      }
      .search-box-wrapper {
        width: 100%;
      }
    }
    
     
    .prompt-card {
      background: var(--bg-surface);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s, box-shadow 0.2s;
      break-inside: avoid;
      margin-bottom: 16px;
    }
    
    .prompt-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(26, 25, 24, 0.08);
    }
    
    .prompt-image-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: var(--bg-muted);
    }
    
    .model-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 12px;
      background: rgba(26, 25, 24, 0.75);

      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      color: white;
      z-index: 10;
    }
    
    .prompt-image {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    
    .prompt-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 25, 24, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .prompt-card:hover .prompt-overlay {
      opacity: 1;
    }
    
    .hover-text {
      color: white;
      font-size: 14px;
      font-weight: 500;
    }
    
    .prompt-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .prompt-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
    }
    
    .prompt-title a {
      color: var(--text-primary);
      text-decoration: none;
    }
    
    .prompt-title a:hover {
      color: var(--accent-hover);
    }
    
    .prompt-description {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .prompt-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .prompt-tag {
      font-size: 12px;
      padding: 4px 10px;
      background: var(--bg-muted);
      border-radius: 100px;
      color: var(--text-secondary);
    }
    
    .prompt-actions {
      margin-top: 4px;
    }
    
    .copy-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-muted);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    .copy-btn:hover {
      background: var(--border-subtle);
      color: var(--text-primary);
    }
    
     
    .loading-more {
      display: flex;
      align-items: center;
      justify-content: center;

    }
    
    .loading-spinner {
      width: 24px;

      border: 2px solid var(--border-subtle);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 14px;
      color: var(--text-tertiary);
    }
    
     
    .site-footer {

    .footer-link:hover {

    @media (max-width: 640px) {

  </style>
  
  
</head>

  <header class="site-header">

          </svg>

        <span class="site-title-text">精彩视频提示词</span>
      </a>
      
      <nav class="header-nav">
        
        <div class="language-switcher">
          
            
              
              
                
              
              <a href="/" class="lang-switch">English ▾</a>
            
          
            
              <span class="lang-switch">简体中文 ▾</span>
            
          
        </div>
      </nav>
    </div>
  </header>
  
  <main class="main-content">
    
  
  <div class="header-full">
    
    <p class="intro-text">A collection of awesome video prompts</p>
    
    
    <div class="search-area">
      <div class="search-row">
        
        <div class="search-box-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" 
                 class="search-input" 
                 placeholder="搜索提示词..."
                 id="search-input">
        </div>
        
        
        <div class="model-tags">
          <span class="model-tag active">All</span>
          <span class="model-tag">Sora</span>
          <span class="model-tag">Runway</span>
          <span class="model-tag">Pika</span>
          <span class="model-tag">Kling</span>
          <span class="model-tag more">+2</span>
        </div>
      </div>
      
      
      <div class="content-tag-area">
        <button class="content-tag active">All</button>
        <button class="content-tag">Nature/自然</button>
        <button class="content-tag">Cinematic</button>
        <button class="content-tag">Portrait</button>
        <button class="content-tag">Futuristic</button>
        <button class="content-tag">Abstract</button>
        <button class="content-tag">Sci-Fi</button>
        <button class="content-tag">Fantasy</button>
        <span class="content-tag more">+12</span>
      </div>
    </div>
  </div>

  
  <div class="grid-header">
    <h2 class="grid-title">Popular Prompts</h2>
    <span class="result-count">0 prompts found</span>
  </div>

  
  <div class="masonry-grid" id="prompts-grid">
    
  </div>

    <span class="loading-text">Loading more prompts...</span>
  </div>

  </main>
  
  <footer class="site-footer">
    <div class="footer-line"></div>
    <div class="footer-content">
      <span class="footer-left">&copy; 2026 精彩视频提示词. 开源项目</span>
      <div class="footer-right">
        <a href="https://github.com" class="footer-link">GitHub</a>
        <a href="#" class="footer-link">提交提示词</a>
        <a href="/about" class="footer-link">关于</a>
      </div>
    </div>
  </footer>

  
<script>
  
  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', function(e) {
    const searchTerm = e.target.value.toLowerCase();
    const cards = document.querySelectorAll('.prompt-card');
    
    cards.forEach(card => {
      const title = card.querySelector('.prompt-title').textContent.toLowerCase();
      const description = card.querySelector('.prompt-description')?.textContent.toLowerCase() || '';
      const tags = Array.from(card.querySelectorAll('.prompt-tag')).map(tag => tag.textContent.toLowerCase());
      
      const isMatch = title.includes(searchTerm) || 
                     description.includes(searchTerm) || 
                     tags.some(tag => tag.includes(searchTerm));
      
      card.style.display = isMatch ? 'block' : 'none';
    });
  });

  
  document.querySelectorAll('.content-tag').forEach(tag => {
    tag.addEventListener('click', function() {
      document.querySelectorAll('.content-tag').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
    });
  });

  
  document.querySelectorAll('.model-tag').forEach(tag => {
    tag.addEventListener('click', function() {
      document.querySelectorAll('.model-tag').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
    });
  });
</script>

</body>
