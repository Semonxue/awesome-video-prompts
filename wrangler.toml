name = "awesome-video-prompts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Pages output dir for OpenNext
pages_build_output_dir = ".open-next/assets"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "prompts-db"
database_id = "2c702680-447e-48bd-801f-f333399de98e"

# R2 bucket for media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "awesome-video-prompts-media"

# KV for caching热门数据
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_YOUR_KV_ID"

# 环境变量（在 CI/CD secrets 里配置，不要硬编码）
[vars]
NEXT_PUBLIC_SITE_URL = "https://awesomevideoprompts.com"
