{{ define "main" }}
  <!-- 网格头部 -->
  <div class="grid-header">
    <h2 class="grid-title">Popular Prompts</h2>
    <span class="result-count">{{ len (where .Site.RegularPages "Params.tags" "!=" nil) }} prompts found</span>
  </div>

  <!-- 瀑布流提示词列表 -->
  <div class="masonry-grid" id="prompts-grid">
    {{ range where .Site.RegularPages "Params.tags" "!=" nil }}
      {{ partial "prompt-card.html" . }}
    {{ end }}
  </div>

  <!-- 加载更多 -->
  <div class="loading-more" id="loading-more">
    <div class="loading-spinner"></div>
    <span class="loading-text">Loading more prompts...</span>
  </div>
{{ end }}

{{ define "scripts" }}
<script>
  // 筛选状态
  let currentSearch = '';
  let currentModel = 'all';
  let currentContentTag = 'all';

  // 统一的筛选函数
  function applyFilters() {
    const cards = document.querySelectorAll('.prompt-card');
    let visibleCount = 0;
    
    cards.forEach(card => {
      const title = card.querySelector('.prompt-title').textContent.toLowerCase();
      const description = card.querySelector('.prompt-description')?.textContent.toLowerCase() || '';
      const cardModel = (card.dataset.model || '').toLowerCase();
      const cardTags = (card.dataset.tags || '').toLowerCase().split(',').map(t => t.trim());
      
      // 搜索匹配
      const searchMatch = !currentSearch || 
                         title.includes(currentSearch) || 
                         description.includes(currentSearch) ||
                         cardTags.some(tag => tag.includes(currentSearch));
      
      // 模型匹配
      const modelMatch = currentModel === 'all' || cardModel === currentModel;
      
      // 内容标签匹配
      const tagMatch = currentContentTag === 'all' || 
                      cardTags.some(tag => tag === currentContentTag);
      
      // 显示符合所有条件的卡片
      const shouldShow = searchMatch && modelMatch && tagMatch;
      card.style.display = shouldShow ? 'block' : 'none';
      if (shouldShow) visibleCount++;
    });
    
    // 更新结果计数
    const resultCount = document.querySelector('.result-count');
    if (resultCount) {
      resultCount.textContent = `${visibleCount} prompts found`;
    }
  }

  // 搜索功能
  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', function(e) {
    currentSearch = e.target.value.toLowerCase().trim();
    applyFilters();
  });

  // 内容标签切换
  document.querySelectorAll('.content-tag').forEach(tag => {
    tag.addEventListener('click', function() {
      if (this.classList.contains('more')) return; // 忽略 +12 按钮
      
      document.querySelectorAll('.content-tag').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      
      const tagText = this.textContent.trim().toLowerCase();
      currentContentTag = tagText === 'all' ? 'all' : tagText.split('/')[0]; // 处理 "Nature/自然" 格式
      applyFilters();
    });
  });

  // 模型标签切换
  document.querySelectorAll('.model-tag').forEach(tag => {
    tag.addEventListener('click', function() {
      if (this.classList.contains('more')) return; // 忽略 +2 按钮
      
      document.querySelectorAll('.model-tag').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      
      const modelText = this.textContent.trim().toLowerCase();
      currentModel = modelText === 'all' ? 'all' : modelText;
      applyFilters();
    });
  });

  // Header滚动切换功能
  const headerDefault = document.querySelector('.header-default');
  const headerCompact = document.querySelector('.header-compact');
  const searchInputCompact = document.getElementById('search-input-compact');
  const searchInputDefault = document.getElementById('search-input');

  window.addEventListener('scroll', () => {
    const currentScroll = window.pageYOffset;
    
    // 滚动超过100px时切换到紧凑版
    if (currentScroll > 100) {
      headerDefault.style.display = 'none';
      headerCompact.style.display = 'block';
      // 同步搜索框内容
      if (searchInputDefault && searchInputCompact) {
        searchInputCompact.value = searchInputDefault.value;
      }
    } else {
      headerDefault.style.display = 'block';
      headerCompact.style.display = 'none';
      // 同步搜索框内容
      if (searchInputDefault && searchInputCompact) {
        searchInputDefault.value = searchInputCompact.value;
      }
    }
  });
  
  // 同步两个搜索框的输入
  if (searchInputDefault && searchInputCompact) {
    searchInputDefault.addEventListener('input', function(e) {
      searchInputCompact.value = e.target.value;
    });
    searchInputCompact.addEventListener('input', function(e) {
      searchInputDefault.value = e.target.value;
    });
  }
</script>
{{ end }}
