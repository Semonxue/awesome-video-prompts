{{ define "main" }}
  <!-- 网格头部 -->
  <div class="grid-header">
    <h2 class="grid-title">Popular Prompts</h2>
    <span class="result-count">{{ len (where .Site.RegularPages "Params.tags" "!=" nil) }} prompts found</span>
  </div>

  <!-- 瀑布流提示词列表 -->
  <div class="masonry-grid" id="prompts-grid">
    {{ range where .Site.RegularPages "Params.tags" "!=" nil }}
      {{ partial "prompt-card.html" . }}
    {{ end }}
  </div>

  <!-- 加载更多 -->
  <div class="loading-more" id="loading-more">
    <div class="loading-spinner"></div>
    <span class="loading-text">Loading more prompts...</span>
  </div>
{{ end }}

{{ define "scripts" }}
<script>
  // 状态管理
  const state = {
    search: '',
    model: 'all',
    tag: 'all'
  };

  // DOM 元素引用
  const dom = {
    get searchInputs() { return document.querySelectorAll('.search-input'); },
    get modelBtns() { return document.querySelectorAll('.model-tag'); },
    get tagBtns() { return document.querySelectorAll('.content-tag'); },
    get grid() { return document.getElementById('prompts-grid'); },
    get cards() { return document.querySelectorAll('.prompt-card'); },
    get countDisplay() { return document.querySelector('.result-count'); },
    get headerDefault() { return document.querySelector('.header-default'); },
    get headerCompact() { return document.querySelector('.header-compact'); },
    get mainContent() { return document.querySelector('.main-content'); }
  };

  // 初始化
  function init() {
    bindEvents();
    // 初始执行一次滚动检查
    updateHeaderState();
    
    // 隐藏加载动画 (因为目前是一次性加载所有内容)
    const loadingMore = document.getElementById('loading-more');
    if (loadingMore) {
        loadingMore.style.display = 'none';
    }
  }

  // 绑定事件
  function bindEvents() {
    // 搜索输入
    dom.searchInputs.forEach(input => {
      input.addEventListener('input', (e) => {
        state.search = e.target.value.toLowerCase().trim();
        // 同步所有搜索框
        dom.searchInputs.forEach(fi => {
            if (fi !== e.target) fi.value = e.target.value;
        });
        filterPrompts();
      });
    });

    // 模型筛选
    dom.modelBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const model = btn.dataset.model;
        updateActiveState(dom.modelBtns, model, 'data-model');
        state.model = model.toLowerCase();
        filterPrompts();
      });
    });

    // 标签筛选
    dom.tagBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        // 阻止默认链接跳转（如果是a标签）
        e.preventDefault();
        const tag = btn.dataset.tag;
        updateActiveState(dom.tagBtns, tag, 'data-tag');
        state.tag = tag.toLowerCase();
        filterPrompts();
      });
    });

    // 滚动监听
    window.addEventListener('scroll', updateHeaderState);

    // Expand/Collapse Tags Logic
    const expandBtns = document.querySelectorAll('.tags-expand-btn');
    expandBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const container = btn.parentElement;
        if (!container) return;
        
        const hiddenArea = container.querySelector('.hidden-tags-container');
        if (!hiddenArea) return;
        
        const btnText = btn.querySelector('.btn-text');
        const isHidden = hiddenArea.style.display === 'none';
        
        if (isHidden) {
          hiddenArea.style.display = 'contents'; // Use contents to blend with flex container or block
          btnText.textContent = '{{ T "show_less" }}';
        } else {
          hiddenArea.style.display = 'none';
          btnText.textContent = '{{ T "show_more" }}';
        }
      });
    });
  }

  // 更新按钮激活状态
  function updateActiveState(elements, value, dataAttr) {
    elements.forEach(el => {
      if (el.getAttribute(dataAttr) === value) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
  }

  // 核心筛选逻辑
  function filterPrompts() {
    let visibleCount = 0;

    dom.cards.forEach(card => {
      // 获取卡片数据
      const cardTitle = (card.querySelector('.prompt-title')?.textContent || '').toLowerCase();
      const cardDesc = (card.querySelector('.prompt-description')?.textContent || '').toLowerCase();
      const cardModel = (card.dataset.model || '').toLowerCase();
      const cardTags = (card.dataset.tags || '').toLowerCase().split(',').filter(t => t);

      // 1. 搜索匹配 (标题 or 描述 or tags包含关键字)
      const matchesSearch = !state.search || 
                            cardTitle.includes(state.search) || 
                            cardDesc.includes(state.search) || 
                            cardTags.some(t => t.includes(state.search));

      // 2. 模型匹配
      const matchesModel = state.model === 'all' || cardModel === state.model;

      // 3. 标签匹配
      const matchesTag = state.tag === 'all' || cardTags.includes(state.tag);

      // 综合判定
      const isVisible = matchesSearch && matchesModel && matchesTag;

      // DOM 操作
      if (isVisible) {
        card.style.display = '';
        visibleCount++;
      } else {
        card.style.display = 'none';
      }
    });

    // 更新计数
    if (dom.countDisplay) {
      dom.countDisplay.textContent = `${visibleCount} prompts found`;
    }
  }

  // Header 滚动切换逻辑
  let isCompact = false;
  function updateHeaderState() {
    if (!dom.mainContent) return;

    const rect = dom.mainContent.getBoundingClientRect();
    const shouldBeCompact = rect.top < 50;

    if (shouldBeCompact && !isCompact) {
      // 切换到 Compact
      isCompact = true;
      toggleHeaders(dom.headerDefault, dom.headerCompact);
    } else if (!shouldBeCompact && isCompact) {
      // 切换到 Default
      isCompact = false;
      toggleHeaders(dom.headerCompact, dom.headerDefault);
    }
  }

  function toggleHeaders(hideEl, showEl) {
    if (!hideEl || !showEl) return;
    
    hideEl.style.display = 'none';
    hideEl.style.opacity = '0';
    
    showEl.style.display = 'block';
    showEl.style.opacity = '0';
    
    // 使用 requestAnimationFrame 确保过渡效果
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        showEl.style.opacity = '1';
      });
    });
  }

  // 启动
  document.addEventListener('DOMContentLoaded', init);
</script>
{{ end }}
